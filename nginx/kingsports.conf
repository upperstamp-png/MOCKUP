    listen [::]:443 ssl http2;
    server_name crm.kingsports.com.br;

    # Certificados Let's Encrypt gerenciados pelo Certbot (ou caminho do certificado SAN único se compartilhado)
    ssl_certificate     /etc/letsencrypt/live/crm.kingsports.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.kingsports.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/crm.kingsports.com.br/chain.pem;

    # TLS Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
