# ==============================================================================
# KING SPORTS FRANCHISING — NGINX PRODUCTION CONFIGURATION (HTTPS + REVERSE PROXY)
# Destino recomendado na VPS: /etc/nginx/sites-available/kingsports.conf
# Link simbólico: ln -s /etc/nginx/sites-available/kingsports.conf /etc/nginx/sites-enabled/
# Substituir "franquia.kingsportsoficial.com.br" pelo domínio oficial de produção.
# ==============================================================================

limit_req_zone $binary_remote_addr zone=ks_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ks_lead_limit:10m rate=3r/m;

server {
    listen 80;
    listen [::]:80;
    server_name franquia.kingsportsoficial.com.br;

    # Validação ACME HTTP-01 do Certbot (Let's Encrypt)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name franquia.kingsportsoficial.com.br;

    # Certificados Let's Encrypt gerenciados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/franquia.kingsportsoficial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/franquia.kingsportsoficial.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/franquia.kingsportsoficial.com.br/chain.pem;

    # TLS Hardening (Modern / Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Segurança de Transporte e Cabeçalhos
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 35m;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /var/www/kingsports/public;
    index index.html;

    # Bloqueio explícito de arquivos sensíveis e código-fonte do servidor
    location ~* ^/(\.env|\.git|server|sql|scripts|tests|node_modules|package\.json|package-lock\.json|Kit_Documentos_King_Sports) {
        deny all;
        return 404;
    }

    # Permitir /.well-known/llms.txt antes do bloqueio de dotfiles
    location = /.well-known/llms.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Endpoints de API Node.js (Proxy Reverso)
    location ^~ /api/v1 {
        limit_req zone=ks_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/public/leads {
        limit_req zone=ks_lead_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=ks_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Franchisee HUB + Studio 3D + Universidade (Next.js via Express Gateway)
    location ^~ /hub {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Fallback para assets estáticos legados do HUB/Studio 3D
    location ^~ /king-sports/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /textures/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/assets/(MOCKUP_MULTIPLAY|[a-z0-9_]+_mask)\.png$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blog SSR, SEO, GEO (llms.txt) e HTML com canonical/X-Robots-Tag dinâmicos (Node.js)
    location ^~ /blog {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt|llms-full\.txt|index\.html|privacidade\.html|termos\.html|obrigado\.html)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Painel CRM Administrativo (Static HTML shell — dados autenticados exclusivamente via /api/admin)
    location /admin {
        alias /var/www/kingsports/admin;
        index login.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ /admin/login.html;
    }

    # Assets estáticos públicos com cache longo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Demais arquivos estáticos públicos (ex.: favicon fallback)
    location / {
        try_files $uri $uri/ =404;
    }
}
