# ==============================================================================
# KING SPORTS FRANCHISING — NGINX PRODUCTION CONFIGURATION (HTTPS + REVERSE PROXY)
# Destino recomendado na VPS: /etc/nginx/sites-available/kingsports.conf
# Link simbólico: ln -sf /etc/nginx/sites-available/kingsports.conf /etc/nginx/sites-enabled/kingsports.conf
#
# Arquitetura multi-subdomínio encaminhando para o Gateway Node.js unificado (:3000):
#   1. lp.kinsports.com.br (+ alias lp.kingsports.com.br) -> Landing Page + Blog SSR + APIs públicas
#   2. crm.kingsports.com.br                              -> CRM de Expansão na raiz (/)
#   3. app.kingsports.com.br                              -> HUB do Franqueado + Studio 3D + Universidade (/)
# ==============================================================================

limit_req_zone $binary_remote_addr zone=ks_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ks_lead_limit:10m rate=3r/m;

# ------------------------------------------------------------------------------
# 1. LANDING PAGE & BLOG SSR (lp.kinsports.com.br / lp.kingsports.com.br)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lp.kinsports.com.br lp.kingsports.com.br;

    # Validação ACME HTTP-01 do Certbot (Let's Encrypt)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lp.kinsports.com.br lp.kingsports.com.br;

    # Certificados Let's Encrypt gerenciados pelo Certbot.
    # Caso utilize um certificado único SAN cobrindo todos os subdomínios, aponte todos os
    # blocos :443 para o mesmo diretório em /etc/letsencrypt/live/<nome-do-cert-san>/.
    # Caso emita certificados separados por subdomínio (padrão do setup-vps.sh), mantenha os caminhos individuais.
    ssl_certificate     /etc/letsencrypt/live/lp.kinsports.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lp.kinsports.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lp.kinsports.com.br/chain.pem;

    # TLS Hardening (Modern / Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Segurança de Transporte e Cabeçalhos
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /var/www/kingsports/public;
    index index.html;

    # Bloqueio explícito de dotfiles e arquivos sensíveis do servidor/repositório
    location ~* ^/(\.env|\.git|server|sql|scripts|tests|node_modules|package\.json|package-lock\.json|Kit_Documentos_King_Sports)(/|$) {
        deny all;
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Permitir /.well-known/llms.txt (GEO) antes do bloqueio genérico de dotfiles
    location = /.well-known/llms.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Isolamento estrito: rotas administrativas, APIs privadas e HUB/Studio/Universidade não existem na LP
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }
    location = /api/v1 { return 404; }
    location ^~ /api/v1/ { return 404; }
    location = /hub { return 404; }
    location ^~ /hub/ { return 404; }
    location = /studio { return 404; }
    location ^~ /studio/ { return 404; }
    location = /universidade { return 404; }
    location ^~ /universidade/ { return 404; }

    # APIs públicas e healthcheck
    location = /api/public/leads {
        limit_req zone=ks_lead_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    location ^~ /api/public/ {
        limit_req zone=ks_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    location = /api/health {
        limit_req zone=ks_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 15s;
    }

    location ^~ /api/ {
        return 404;
    }

    # Blog SSR, SEO, GEO (llms.txt) e páginas HTML públicas com canonical dinâmico
    location = /blog {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /blog/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt|llms-full\.txt|index\.html|privacidade\.html|termos\.html|obrigado\.html)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/portal/?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Assets estáticos públicos da LP com cache longo
    location ^~ /assets/ {
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Demais arquivos estáticos públicos (ex.: favicon.ico)
    location / {
        try_files $uri $uri/ =404;
    }
}

