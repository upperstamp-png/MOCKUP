    ssl_stapling_verify on;

    # Segurança de Transporte, Cabeçalhos e Anti-Indexação
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 20m;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Bloqueio explícito de dotfiles e arquivos sensíveis
    location ~* ^/(\.env|\.git|server|sql|scripts|tests|node_modules|package\.json|package-lock\.json|Kit_Documentos_King_Sports)(/|$) {
        deny all;
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Isolamento estrito: bloquear LP, Blog, APIs públicas (exceto /api/public/config) e HUB (/api/v1) no domínio do CRM
    location = /api/v1 { return 404; }
    location ^~ /api/v1/ { return 404; }
    location = /api/public { return 404; }
    location = /api/public/config {
        limit_req zone=ks_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 15s;
    }
    location ^~ /api/public/ { return 404; }
    location = /hub { return 404; }
    location ^~ /hub/ { return 404; }
    location = /studio { return 404; }
    location ^~ /studio/ { return 404; }
    location = /universidade { return 404; }
    location ^~ /universidade/ { return 404; }
    location = /blog { return 404; }
    location ^~ /blog/ { return 404; }
    location ~ ^/(sitemap\.xml|llms\.txt|llms-full\.txt|index\.html|privacidade\.html|termos\.html|obrigado\.html)$ { return 404; }

    location = /robots.txt {
        default_type text/plain;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *
Disallow: /
";
    }

    # API administrativa do CRM
    location ^~ /api/admin {
        limit_req zone=ks_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/health {
        limit_req zone=ks_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 15s;
    }

    location ^~ /api/ {
        return 404;
    }

    # Shell e assets do CRM operando na raiz (/) via Gateway Express
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}

# ------------------------------------------------------------------------------
# 3. HUB DO FRANQUEADO + MOCKUP STUDIO 3D + UNIVERSIDADE (app.kingsports.com.br)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.kingsports.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.kingsports.com.br;

    # Certificados Let's Encrypt gerenciados pelo Certbot (ou caminho do certificado SAN único se compartilhado)
    ssl_certificate     /etc/letsencrypt/live/app.kingsports.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kingsports.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.kingsports.com.br/chain.pem;

    # TLS Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Segurança de Transporte, Cabeçalhos e Anti-Indexação
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 35m;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Bloqueio explícito de dotfiles e arquivos sensíveis
    location ~* ^/(\.env|\.git|server|sql|scripts|tests|node_modules|package\.json|package-lock\.json|Kit_Documentos_King_Sports)(/|$) {
        deny all;
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Isolamento estrito: bloquear rotas da LP e APIs do CRM de Expansão neste subdomínio
    # Nota: /admin no HUB pertence à página Network Admin do Next.js (hub/MOCKUP/apps/web/app/admin/page.tsx)
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }
    location = /api/public { return 404; }
    location ^~ /api/public/ { return 404; }
    location = /blog { return 404; }
    location ^~ /blog/ { return 404; }
    location ~ ^/(sitemap\.xml|llms\.txt|llms-full\.txt|index\.html|privacidade\.html|termos\.html|obrigado\.html)$ { return 404; }

    location = /robots.txt {
        default_type text/plain;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *
Disallow: /
";
    }

    # API do Portal do Franqueado (Fastify :4000 via Gateway Express :3000)
    location ^~ /api/v1/ {
        limit_req zone=ks_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/health {
        limit_req zone=ks_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 15s;
    }

    # HUB + Studio 3D + Universidade operando na raiz (/) com suporte a WebSocket / Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
