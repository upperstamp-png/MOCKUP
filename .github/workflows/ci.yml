name: CI - King Sports Plataforma Unificada

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Build & Testes Unitários
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar Dependências (Raiz + HUB)
        run: |
          npm ci
          npm --prefix hub/MOCKUP ci

      - name: Validar Sintaxe & Compilar Projeto Unificado
        run: npm run build
        env:
          NEXT_PUBLIC_PORTAL_API_BASE: /api/v1

      - name: Executar Testes Unitários (Raiz, Canvas Engine & API)
        run: |
          npm run test:unit
          node --test hub/MOCKUP/packages/canvas-engine/tests/canvas.test.ts
          npm --prefix hub/MOCKUP exec tsx -- apps/api/tests/api.test.ts
